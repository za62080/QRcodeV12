<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="QRコードを読み取り、履歴を保存・メール・SMS・共有できるWebアプリ">
  <title>QRコード読み取り</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
  <script src="app.js" defer></script>
<link rel="manifest" href="../manifest.webmanifest"><link rel="icon" href="../icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="QRコード読み取り"></head>
<body>
<main class="app">
  <header><h1>QRコード読み取り</h1></header>
  <section class="panel compact-settings">
    <h2>読み取り設定</h2>
    <label class="checkline"><input id="continuousRegistration" type="checkbox"> 連続登録可</label>
    <label class="checkline"><input id="allowDuplicates" type="checkbox"> 同一データ登録可</label>
  </section>

  <section class="panel pause-panel"><h2>読取更新停止時間</h2><label>停止時間（秒）<input id="pauseSeconds" type="number" min="0.3" max="60" step="0.1" value="10" inputmode="decimal"></label><select id="userProfile" hidden><option value="guest">ゲスト</option></select></section>
  
  <p id="notice" class="notice" role="status" aria-live="polite"></p>

  <section class="panel">
    <div class="actions"><button id="cameraBtn" class="camera-toggle camera-off">カメラ起動</button></div><div class="camera-controls"><label>ズーム <input id="zoomRange" type="range" min="1" max="1" step="0.1" value="1" disabled></label><span id="zoomValue">1.0×</span><label class="checkbox-label"><input id="autoTorch" type="checkbox">暗い場合は自動ライト</label><button id="torchBtn" type="button" disabled>ライト ON</button><span id="torchStatus" aria-live="polite"></span></div><div class="camera-layout"><div id="reader" class="reader"></div><div class="camera-side-actions"><button id="releaseFreezeBtn" type="button" disabled>取り消し</button><button id="acceptBtn" type="button" class="primary" disabled>取り込み</button></div></div>
  </section>

  <section class="panel">
    <h2>QRコード読取結果</h2>
    <textarea id="latestResult" rows="3" readonly placeholder="QRコードを読み取るとここに表示されます"></textarea>
    <p id="pendingStatus" hidden></p>
  </section>

  

  <section class="panel">
    <div class="section-head"><h2>読み取り履歴</h2><button id="clearBtn" class="danger" disabled>全削除</button></div>
    <div class="table-wrap"><table><thead><tr><th>識別番号</th><th>QRコードデータ</th><th>読取日時</th><th></th></tr></thead><tbody id="historyBody"><tr class="empty"><td colspan="4">まだデータがありません</td></tr></tbody></table></div>
    <div class="actions export"><button id="csvBtn" disabled>CSV出力</button></div><p id="csvLocation" class="file-location" aria-live="polite"></p>
  </section>

  <section class="panel secure-panel">
    <h2>② 暗号化して送信</h2>
    
    <div class="form-grid">
      <div class="password-options"><label>パスワード最低文字数（4～128）<input id="passwordMinLength" type="number" min="4" max="128" step="1" value="10"></label><label class="checkbox-label"><input id="strongPasswordRule" type="checkbox" checked>英小文字・英大文字・数字をすべて必須にする</label></div>
      <label>暗号化パスワード<input id="encPassword" type="password" autocomplete="new-password" placeholder="指定した最低文字数以上"></label>
      <label>パスワード確認<input id="encPassword2" type="password" autocomplete="new-password" placeholder="もう一度入力"></label>
    </div>
    <div class="actions">
      <div class="save-action"><button id="encryptSaveBtn" class="primary" disabled>① 暗号化ファイルを保存</button><p id="encryptedLocation" class="file-location" aria-live="polite"></p></div>
      <div class="share-action"><button id="encryptShareBtn" disabled>② 暗号化ファイルを共有</button><label id="shareEmailLabel" hidden>メール送信先アドレス<input id="shareEmail" type="email" autocomplete="email" placeholder="example@example.com"></label><p id="shareHelp" class="file-location" aria-live="polite"></p></div>
    </div>
    <p class="hint">受信者にはパスワードをメール本文とは別の経路で伝えてください。</p>
    <p class="hint">メール本文に復号ページURLを自動挿入します：<br><code id="receiverUrl"></code></p>
  </section>

  <section class="panel">
    <h2>送信後の履歴</h2>
    <label class="checkline"><input id="autoClear" type="checkbox" checked> 送信画面からこのアプリへ戻ったとき、履歴をクリアするか確認する</label>
    <p class="hint">ブラウザから実際のメール/SMS送信完了は検出できないため、自動削除ではなく確認してから削除します。共有機能は共有処理が正常終了した場合に確認します。</p>
  </section>

  

<section class="panel"><h2>③ サーバーへ暗号化データを送信</h2><p>送信側アカウントでログインしてください。パスワードはサーバーへ送りません。</p><label>ログイン用メールアドレス<input id="cloudEmail" type="email" autocomplete="username"></label><label>ログイン用パスワード<input id="cloudPassword" type="password" autocomplete="current-password"></label><div class="actions"><button id="cloudLogin" type="button">ログイン</button><button id="cloudLogout" type="button">ログアウト</button><button id="cloudUpload" type="button" class="primary">暗号化してサーバー送信</button></div><p id="cloudStatus" role="status" aria-live="polite"></p></section><script type="module" src="cloud-sender.js"></script><div class="exit-area"><button id="exitAppBtn" type="button" class="danger">アプリ終了</button></div></main>
</body>
</html>
